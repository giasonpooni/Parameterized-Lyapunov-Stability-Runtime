[project]
name = "parameterized-lyapunov-stability-runtime"
version = "0.1.0"
description = "A computational runtime for evaluating quadratic Lyapunov certificates on declared linear and affine-parameter plants."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = ["pytest>=8", "coverage>=7"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lyapunov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src/lyapunov"]

[tool.coverage.report]
precision = 2
# A ratchet, not a target. Raise it when coverage rises; never lower it to
# make a change fit. The remaining gap is accounted for in
# docs/DEVELOPMENT.md and is defensive code that cannot fire.
fail_under = 98.8
show_missing = true
