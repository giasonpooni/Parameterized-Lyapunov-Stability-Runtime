name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.10"
      - name: Run quickstart
        run: uv run --python ${{ matrix.python }} python examples/quickstart.py
      - name: Run cross-reference benchmarks
        run: uv run --python ${{ matrix.python }} python examples/cross_reference.py
      - name: Build package
        run: uv build --python ${{ matrix.python }}
      - name: Run default suite
        run: uv run --python ${{ matrix.python }} --dev pytest -q

      # A green suite proves the tests ran, not that they are load bearing.
      # Ubuntu and one interpreter only: the gate replays the suite once per
      # mutation, and it tests the tests, which are not platform dependent.
      - name: Mutation gate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run --python ${{ matrix.python }} --dev python tools/mutation_check.py

      # The laws as relations over random draws, not as fixtures. Small here;
      # run it deeper by hand when touching charts, the solve or the runtime.
      - name: Property sweep
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run --python ${{ matrix.python }} python tools/property_sweep.py --draws 2000

      # Nearly every uncovered line in this package used to be a `raise`, so
      # the paths that carry the product were the least exercised code in it.
      # The floor is a ratchet: raise it, never lower it.
      - name: Coverage floor
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          uv run --python ${{ matrix.python }} --dev python -m coverage run -m pytest -q
          uv run --python ${{ matrix.python }} --dev python -m coverage report

  guest:
    name: i64 guest twin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The crate has no dependencies, so this needs no network and no
      # cargo-prove. guests/discrete-morphisms-v1/sp1-program is a different
      # package and stays out of CI, as docs/GATE.md requires.
      - name: Test the Rust twin
        working-directory: guests/discrete-morphisms-v1
        run: cargo test --locked
      - name: Run the twin CLI
        working-directory: guests/discrete-morphisms-v1
        run: cargo run --locked

      # The contract makes the twins referees for each other. Check that on
      # generated cases, not only on the four fixtures.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.10"
      - name: Differential test of the two twins
        run: uv run --python 3.13 python tools/differential_twins.py --cases 4000
